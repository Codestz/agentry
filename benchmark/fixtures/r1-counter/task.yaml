# R1 — a small build task (one module + one behavior). Generic: declares the contract to satisfy, not a
# repo-specific location. The hidden suite (sibling grader/) verifies the produced module's behavior.
id: r1-counter
regime: R1
armEligibility: [A, B, C]
prompt: |
  Create `src/counter.js` (CommonJS) exporting a function `count(items)` that returns the number of elements
  in the array `items` (0 for an empty array). Also create `test/counter.test.js` that uses Node's built-in
  `node:test` + `node:assert` to assert `count([]) === 0` and `count(['a','b']) === 2`, and passes under
  `node --test`.

packages:
  - packages/*
  - packages/workbench/*

# pnpm ≥ 10 does not run dependency build scripts unless explicitly allowed. esbuild needs its postinstall
# (the platform binary) for the memory MCP bundle; biome ships a native binary too. Everything else stays denied.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  sharp: false

minimumReleaseAgeExclude:
  - astro@6.4.8

# Moat (memory-hygiene) fixture — does recalled memory make a task route LIGHTER?
#
# Each task pairs a COLD floor (the shape it routes to with empty memory) with a RELEVANT fork-resolving fact
# (expected to collapse the fork → route lighter) and an irrelevant DECOY fact (the discrimination control →
# expected NOT to change the shape). The codebase is seeded from `seeds/<id>` when present (else built fresh).
#
# FORK-DESIGN PRINCIPLE (learned N=6, 2026-06-22): a moat fork must present MULTIPLE genuinely-plausible options
# the model CANNOT infer from the bare prompt — a PROJECT-SPECIFIC decision (this repo dedupes on email; renders
# user-local time; rejects engagement ranking; never retries 4xx). An INDUSTRY-DEFAULT fork (use integer cents for
# money; use ULIDs for ids) leaks: a strong model one-shots it correctly WITHOUT the memory, so the decoy run also
# lightens and the pair fails to isolate memory's effect. Memory's edge is on what a model can't already guess.
version: 1
tasks:
  - id: routing-dedupe-key
    prompt: |
      Add a `dedupe(items)` helper to `src/utils.js` that removes duplicate user records from a list.
    # COLD: the id-vs-email "what is a duplicate" fork is undecided → the conductor escalates to spec-first.
    cold_floor: spec-first
    # A verbatim clause from the relevant fact — confirms it actually SURFACED in recall (not just non-empty).
    fact_signature: "not stable across imports"
    relevant:
      type: decision
      scope: repo
      tags: [dedupe, identity, users, email]
      provenance: [src/users.js]
      why: "Settles the only load-bearing fork in this repo's user-dedup work so it need not be re-litigated."
      text: >-
        For user-deduplication in this codebase, two user records are duplicates iff their email matches
        case-insensitively. Key dedup on the case-folded email and keep the FIRST occurrence; never key on id
        (ids are not stable across imports, so id-keying would treat one person as two accounts). This settles
        the findById-vs-findByEmail ambiguity.
    # An on-topic-but-irrelevant fact: it does NOT resolve the duplicate-identity fork, so it must NOT let the
    # conductor one-shot. If it does, "compounding" is memory-agnostic and the discrimination gate fires.
    decoy:
      type: repo-fact
      scope: repo
      tags: [tooling, build]
      provenance: [package.json]
      text: >-
        This project ships as ESM and uses Node's built-in test runner (node:test); there is no bundler and no
        TypeScript build step. Helpers in src/ are plain .js with named exports.

  # Notification-channel fork: in-app vs email vs both, sync vs queued — genuinely product-dependent, no default.
  - id: moat-notify-channel
    prompt: |
      Add a `notify(user, event)` helper to `src/notify.js` that delivers a notification to a user.
    cold_floor: spec-first
    fact_signature: "never sent by default"
    relevant:
      type: decision
      scope: repo
      tags: [notifications, channels, email, delivery]
      provenance: [src/notify.js]
      why: "Settles the notification-channel fork (which channels, when) so it need not be re-litigated."
      text: >-
        Notifications in this codebase default to IN-APP ONLY; email is opt-in per
        `user.preferences.emailNotifications` and is never sent by default (a prior incident spammed users who
        never asked for email). Delivery is always enqueued on the async notification queue, never sent inline in
        the request. This settles how notify must be written.
    decoy:
      type: repo-fact
      scope: repo
      tags: [i18n, copy]
      provenance: [src/i18n.js]
      text: >-
        All user-facing notification copy is rendered through the i18n layer keyed by the user's locale; never
        hard-code English strings.

  # Timezone-display fork: UTC vs server-local vs user-local is a real choice with a wrong answer (a prior support
  # incident). The relevant decision settles it → warm one-shot; the on-topic storage-format decoy does not.
  - id: moat-timezone-display
    prompt: |
      Add a `formatEventTime(date, opts)` helper to `src/format.js` that returns a display string for an event
      timestamp.
    cold_floor: spec-first
    fact_signature: "never UTC and never the server's local time"
    relevant:
      type: decision
      scope: repo
      tags: [time, timezone, display, formatting]
      provenance: [src/format.js]
      why: "Settles the only load-bearing fork in this repo's timestamp-display work so it need not be re-litigated."
      text: >-
        All user-facing timestamps in this codebase render in the USER'S local timezone, passed via `opts.tz` —
        never UTC and never the server's local time. A prior support incident traced user confusion to UTC display.
        Format as "MMM d, h:mm a" in the user's tz; this settles how formatEventTime must be written.
    decoy:
      type: repo-fact
      scope: repo
      tags: [storage, dates]
      provenance: [src/db.js]
      text: >-
        Dates are persisted as epoch-millisecond integers throughout the codebase, not ISO-8601 strings; parse
        with `new Date(ms)` at the edges.

  # Sort-order fork: chronological vs engagement-ranked is a real product decision. The relevant decision settles
  # it → warm one-shot; the on-topic soft-delete decoy does not touch ordering.
  - id: moat-feed-sort
    prompt: |
      Add a `sortFeed(posts)` helper to `src/feed.js` that orders posts for the main feed.
    cold_floor: spec-first
    fact_signature: "explicitly rejected engagement-based ranking"
    relevant:
      type: decision
      scope: repo
      tags: [feed, sort, ordering, ranking]
      provenance: [src/feed.js]
      why: "Settles the feed-ordering fork (chronological vs ranked) so it need not be re-litigated."
      text: >-
        The main feed is ordered strictly by createdAt DESCENDING (newest first), with id as the tiebreaker. The
        team explicitly rejected engagement-based ranking (by likes/score) to keep the feed chronological and
        predictable. Never sort by popularity; this settles how sortFeed must be written.
    decoy:
      type: repo-fact
      scope: repo
      tags: [soft-delete, repository]
      provenance: [src/posts.js]
      text: >-
        Posts carry a soft-delete `deletedAt`; deleted rows are excluded upstream in the repository layer, so
        downstream helpers never need to filter them.

  # Search-match fork: exact vs prefix vs fuzzy, which fields — genuinely UX-dependent, no default.
  - id: moat-search-match
    prompt: |
      Add a `searchUsers(query, users)` helper to `src/search.js` that finds users matching a query.
    cold_floor: spec-first
    fact_signature: "prefix match on name AND email"
    relevant:
      type: decision
      scope: repo
      tags: [search, matching, users]
      provenance: [src/search.js]
      why: "Settles the search-match fork (exact vs prefix vs fuzzy, which fields) so it need not be re-litigated."
      text: >-
        User search in this codebase is a case-insensitive PREFIX match on name AND email — not fuzzy, not
        full-substring. Fuzzy matching was explicitly rejected as too noisy for the admin tool. This settles how
        searchUsers must be written.
    decoy:
      type: repo-fact
      scope: repo
      tags: [search, limits]
      provenance: [src/search.js]
      text: >-
        Search results are capped at 50 rows and returned unpaginated; the admin UI does not page search results.

  # Retry-policy fork: how many retries, what backoff, which errors — a real resilience choice with a wrong answer
  # (a retry storm). The relevant decision settles it → warm one-shot; the on-topic tracing decoy does not.
  - id: moat-retry-policy
    prompt: |
      Add a `withRetry(fn)` wrapper to `src/http.js` for the outbound API client.
    cold_floor: spec-first
    fact_signature: "never on 4xx"
    relevant:
      type: decision
      scope: repo
      tags: [http, retry, resilience, backoff]
      provenance: [src/http.js]
      why: "Settles the outbound-retry fork (count/backoff/which errors) so it need not be re-litigated."
      text: >-
        The outbound client retries exactly 3 times with exponential backoff (200ms base, doubling each attempt),
        and ONLY on network errors and HTTP 5xx — never on 4xx (a 4xx is a client bug; retrying it just amplifies
        load). This was settled after a retry storm on 429s; it settles how withRetry must be written.
    decoy:
      type: repo-fact
      scope: repo
      tags: [http, tracing, headers]
      provenance: [src/http.js]
      text: >-
        Every outbound request carries an `X-Request-Id` header for distributed tracing, propagated from the
        inbound request's id (or minted if absent).

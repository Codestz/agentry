# Routing-accuracy labeled task set — the ground truth for the self-eval ROUTING probe.
# Spec: .agentry/work/benchmark-selfeval/spec.md (AC1) · OQ3 resolution: floors are rubric-anchored,
# carry a structured/checkable rationale, and were agreed by a SECOND INDEPENDENT labeler (blind) at
# fixture-creation. Non-circular: correct_floor = what the conducting rubric's INTENT prescribes; the
# probe measures what the conductor's BEHAVIOR (events.jsonl dispatch) actually did.
#
# Rubric (ground truth): skills/conducting/references/routing-and-dispatch.md — "Signals → shape rubric"
# + the OVERRIDE: the highest-severity signal sets the floor; `Unknowns: real` or `Decision-content:
# undecided fork` VETOES one-shot → forces >= spec-first REGARDLESS of scope (small footprint != small
# decision). Floors: one-shot | spec-first | decompose.
#
# Labeling provenance (OQ3): labeler_a applied the rubric task-by-task; labeler_b is an independent agent
# given ONLY the rubric + the bare prompts (blind to labeler_a). agreement: true iff both reached the same
# floor. Disagreements are escalated/excluded, never shipped. Agreement at creation: 7/7.
#
# Spread (AC8 saturation guard — must NOT collapse to one shape): one-shot x2, spec-first x3, decompose x2.
#
# KIND axis (ADR-005 / AC11): escalated tasks (where the conductor writes a `spec.md` an `extractKind` can read)
# carry an OPTIONAL `kind` label drawn from the six known kinds (feature, bug, refactor, perf, dep-upgrade,
# ci-red). One-shots omit it by design (a one-shot writes no artifact, so its kind is not measurable here). The
# loader enforces that the labeled set covers all six kinds. `feature` appears at BOTH spec-first
# (re-sf-soft-delete) and decompose (routing-notifications-feature) — the same kind at two complexities, the
# orthogonality (AC4) the kind axis is measured against. The kind label is orthogonal metadata for the kind
# probe; it never changes a task's `correct_floor`.

version: 1
labeling:
  rubric_ref: skills/conducting/references/routing-and-dispatch.md
  labeler_a: conductor (rubric-applied, task-by-task)
  labeler_b: independent agent, blind to labeler_a's floors
  agreement_at_creation: "7/7"

tasks:
  - id: routing-format-price
    prompt: |
      In `src/format.js`, `formatPrice(cents)` returns dollars but drops trailing zeros
      (`formatPrice(500)` yields `$5` not `$5.00`). Fix it so it always shows 2 decimal places.
    correct_floor: one-shot
    trap: must-not-over-orchestrate
    rationale:
      governing_signal: "Specificity: done=X clear · Scope: one symbol · Decision-content: how is obvious"
      bounded_reversible: "single function body, trivially undoable, no contract/interface change, no fork"
    labels: { labeler_a: one-shot, labeler_b: one-shot, agreement: true }

  - id: routing-version-flag
    prompt: |
      Add a `--version` flag to the CLI in `bin/cli.js` that prints the version from package.json
      and exits 0.
    correct_floor: one-shot
    rationale:
      governing_signal: "Specificity: done=X clear · Scope: one file · Unknowns: none"
      bounded_reversible: "additive single-file flag, obvious how, no undecided choice"
    labels: { labeler_a: one-shot, labeler_b: one-shot, agreement: true }

  - id: routing-dedupe-key
    prompt: |
      Add a `dedupe(items)` helper to `src/utils.js` that removes duplicate user records from a list.
    correct_floor: spec-first
    kind: bug
    trap: must-escalate
    rationale:
      governing_signal: "Decision-content: undecided fork (VETOES one-shot, override rule)"
      decision_hidden: "what defines a 'duplicate' (by id? by email? case-folded? deep-equality?) and which copy is kept (first vs last)"
      consequence: "wrong key silently merges distinct users or leaves dupes through — data corruption with no error"
      footprint_note: "one function, one file — Scope alone reads one-shot, but the decision is load-bearing (small footprint != small decision)"
    labels: { labeler_a: spec-first, labeler_b: spec-first, agreement: true }

  - id: routing-token-ttl
    prompt: |
      Change the session token TTL in `auth/config.js` from 1 hour to something more secure.
    correct_floor: spec-first
    kind: refactor
    trap: must-escalate
    rationale:
      governing_signal: "Decision-content: undecided fork + Specificity: vague ('more secure')"
      decision_hidden: "the actual TTL value, and whether to add refresh / sliding expiry — a security-vs-UX fork"
      consequence: "too short logs active users out (UX); too long widens the session-theft window (security) — a one-line edit makes the call silently and badly"
      footprint_note: "literally one line — Scope reads one-shot, but the fork must be decided in a spec, not inside the edit"
    labels: { labeler_a: spec-first, labeler_b: spec-first, agreement: true }

  - id: routing-search-faster
    prompt: |
      Make the search results page load faster.
    correct_floor: spec-first
    kind: perf
    rationale:
      governing_signal: "Specificity: vague ('make X better') · Unknowns: real (where is the bottleneck?)"
      decision_hidden: "what 'faster' means (which metric / target) and which layer to optimize — undiagnosed"
      consequence: "one-shotting picks an arbitrary optimization that may not touch the real bottleneck — wasted work, no measured win"
    labels: { labeler_a: spec-first, labeler_b: spec-first, agreement: true }

  - id: routing-users-pagination
    prompt: |
      Add pagination to the users API across the HTTP handler, the service layer, and the data-access
      layer, with limit/offset query params and a total-count response header.
    # re-labeled 2026-06-15: decompose -> spec-first. 3 TIGHTLY-COUPLED thin layers = ONE coherent change
    # threaded through coupled seams (one contract/return-shape propagates handler->service->dao), NOT
    # separable units warranting parallel task contracts. The pagination-semantics fork vetoes one-shot.
    # Borderline vs decompose (judgment.md cites this prompt as decompose under a 'clean independent seams'
    # assumption the seed deliberately violates); 2 independent labelers concur spec-first for THIS seed.
    correct_floor: spec-first
    rationale:
      governing_signal: "Decision-content: pagination-semantics fork vetoes one-shot · Scope: 3 coupled thin layers, one coherent change"
      decision_hidden: "pagination semantics — param names (limit/offset), default + max page size, where total-count lives (header vs body)"
      consequence: "guessing the semantics ships a wrong, fragile API contract that clients build against"
    labels: { labeler_a: spec-first, labeler_b: spec-first, agreement: true }

  - id: routing-notifications-feature
    prompt: |
      Build a notifications feature: a data model, a service that creates notifications, a REST endpoint
      to list and mark-as-read, and a background worker that delivers them.
    correct_floor: decompose
    kind: feature
    rationale:
      governing_signal: "Scope: many modules (model + service + endpoint + worker) · Specificity: clear"
      seams: "four components with seams between them — a multi-part feature build, not a single edit"
    labels: { labeler_a: decompose, labeler_b: decompose, agreement: true }

  - id: re-os-temp-convert
    prompt: In src/temp.js, celsiusToF(c) uses the wrong formula (returns c*9/5 instead of c*9/5+32). Fix it.
    correct_floor: one-shot
    trap: must-not-over-orchestrate
    rationale:
      governing_signal: The prompt states both the exact defect (celsiusToF returns c*9/5) and the exact correct formula (c*9/5+32), so the fix is fully specified — a single-token change to one line in one named file (src/temp.js). The sibling fToCelsius already shows the +32 convention, confirming the bug and the right answer with zero ambiguity.
      bounded_reversible: The edit touches one return statement in one function; report.js merely consumes celsiusToF and needs no change. Nothing else in the seed depends on the wrong behavior, the change is a one-line diff, and it is trivially revertible — no decision is hidden, nothing forks, so spec-first or decompose would be pure overhead on a self-evident one-liner.
    labels:
      labeler_a: one-shot
      labeler_b: one-shot
      agreement: true

  - id: re-os-cli-quiet
    prompt: Add a --quiet flag to the CLI in bin/run.js that suppresses the normal stdout banner.
    correct_floor: one-shot
    trap: must-not-over-orchestrate
    rationale:
      governing_signal: "Single clearly-scoped target file (bin/run.js) with an established arg-parsing pattern to extend; the task names the exact file, the exact flag, and the exact effect. printBanner() is the one unconditional stdout write, so the change is mechanical: add a --quiet case to parseArgs and guard the printBanner() call. No competing conventions, no separable units, no undecided key/policy."
      bounded_reversible: One flag, one guarded call site in one file. Banner already lives on stdout (not stderr) and progress/build output is emitted separately by run(), so suppressing the banner cannot collide with other output paths. The edit is a few lines, trivially diffable and revertible; routing it through spec-first or decompose would be pure overhead with nothing to decide or split.
    labels:
      labeler_a: one-shot
      labeler_b: one-shot
      agreement: true

  - id: re-os-null-guard
    prompt: In src/user.js, getDisplayName(user) crashes when user.profile is undefined. Add a guard so it returns the email instead.
    correct_floor: one-shot
    held_out: true
    trap: must-not-over-orchestrate
    rationale:
      governing_signal: "getDisplayName dereferences user.profile.firstName/lastName directly, so an undefined profile throws — the bug the prompt names is literally present. The record shape is documented in-file (email plus optional profile, absent for invite-flow users), so the fallback the prompt asks for (return the email) is already an existing field. The whole change is a single early guard in one function in one file: if profile is missing, return user.email. No competing convention, no undecided policy, no second concern to coordinate — render.js merely consumes the function and is untouched."
      bounded_reversible: "One guard clause at the top of getDisplayName in src/user.js: `if (!user.profile) return user.email;`. Fully contained in a single function, trivially revertible, observable by the function no longer throwing on a profile-less user. No interface, contract, or caller changes — getInitials and renderUserRow keep working unchanged."
    labels:
      labeler_a: one-shot
      labeler_b: one-shot
      agreement: true

  - id: re-os-rename-fn
    prompt: Rename the function calcTot to calculateTotal in src/cart.js and update its callers in that file.
    correct_floor: one-shot
    trap: must-not-over-orchestrate
    rationale:
      governing_signal: The prompt names one symbol (calcTot), one file (src/cart.js), one verb (rename), and scopes callers to that same file. The seed is a single self-contained module where calcTot is declared once and called by exactly two same-file functions (applyDiscount, summarize) plus the export line — every occurrence is mechanical and visible in the one file the task points at.
      bounded_reversible: "The whole change is a find/replace of calcTot to calculateTotal within src/cart.js: one declaration, two call sites, one export key. There is no second file, no external importer, no naming choice (the new name is given), and no behavior change — so it is fully bounded to one file and trivially reversible by renaming back. Spinning up spec/plan/decompose machinery would be pure overhead; this is a deliberately-trivial one-shot."
    labels:
      labeler_a: one-shot
      labeler_b: one-shot
      agreement: true

  - id: re-os-const-bump
    prompt: In src/config.js, change MAX_UPLOAD_MB from 5 to 25.
    correct_floor: one-shot
    trap: must-not-over-orchestrate
    rationale:
      governing_signal: The task names the exact file (src/config.js), the exact symbol (MAX_UPLOAD_MB), the current value (5), and the new value (25). There is exactly one constant to flip, with no choice of how. config.js holds three sibling constants but only MAX_UPLOAD_MB is targeted, and the value 25 is given outright — nothing to research, weigh, or decide. The consumers (upload.js multiplies it into a byte limit, server.js wires the validator) read the constant by name, so they require no edits; they exist only to make the constant a real load-bearing value rather than a dead literal.
      bounded_reversible: "A one-character-class change to a single numeric literal in one file: edit 5 to 25 on the MAX_UPLOAD_MB line. The blast radius is contained — downstream code already references the symbol, so behavior updates automatically and correctly. Trivially reversible by flipping it back; spinning up spec-first or decompose machinery here would be pure overhead on an obvious, self-evidently-correct edit."
    labels:
      labeler_a: one-shot
      labeler_b: one-shot
      agreement: true

  - id: re-os-add-test
    prompt: Add a node:test unit test for the existing pure function slugify(s) in src/slug.js, covering spaces and uppercase.
    correct_floor: one-shot
    held_out: true
    trap: must-not-over-orchestrate
    rationale:
      governing_signal: "The prompt fully specifies the target (a node:test unit test), the subject (the already-existing pure slugify(s)), its location (src/slug.js), and the exact cases to cover (spaces and uppercase). The seed makes that premise literally true: slug.js exists with slugify implemented and exported, and there is deliberately NO test file present, so the only thing missing is the one obvious test file. Nothing in the function's behavior is undecided — it lowercases, trims, and collapses whitespace to single hyphens, all observable from the code and its doc examples, so the assertions write themselves (slugify('Hello World') === 'hello-world')."
      bounded_reversible: Adding one self-contained test file (e.g. test/slug.test.js) against an unchanged pure function is fully additive and trivially reversible — delete the file and nothing else is affected. No production code is touched, no contract or convention decision is forked, and the single function is exported via a stable CommonJS barrel, so the change is mechanical and one-shot; spinning up spec or decompose machinery would be pure overhead.
    labels:
      labeler_a: one-shot
      labeler_b: one-shot
      agreement: true

  - id: re-os-error-msg
    prompt: In src/auth.js the login error says "Invalid passowrd" (typo) — fix the spelling to "Invalid password".
    correct_floor: one-shot
    trap: must-not-over-orchestrate
    rationale:
      governing_signal: "The prompt names the exact file (src/auth.js), the exact wrong string (\"Invalid passowrd\"), and the exact replacement (\"Invalid password\"). The seed makes that premise literally true: src/auth.js contains the typo'd string (twice, on the two login-failure return paths) and nothing else in the tree spells it differently. There is no convention to reconcile, no policy to pick, and no second component to coordinate — users.js is inert support (hash/lookup) that the change never touches. The whole job is a string edit in one named target."
      bounded_reversible: The change is a single literal substitution of 'passowrd'->'password' inside one file's two return statements; it is mechanically obvious, owns no interface, and is trivially reverted by re-typing the typo. Routing it through spec or decompose would add ceremony with zero decision to govern — the seed deliberately hides no fork, so any shape heavier than one-shot is over-orchestration.
    labels:
      labeler_a: one-shot
      labeler_b: one-shot
      agreement: true

  - id: re-os-clamp
    prompt: In src/volume.js, setVolume(n) should clamp n to the range 0..100. Add the clamping.
    correct_floor: one-shot
    trap: must-not-over-orchestrate
    rationale:
      governing_signal: The prompt fully specifies the target (src/volume.js), the function (setVolume), the operation (clamp n), and the exact range (0..100). The seed exposes a single trivial setVolume that assigns n directly with no clamping, so the change is a self-evident two-bound wrap (Math.min(100, Math.max(0, n))) with no convention, policy, or value left to pick.
      bounded_reversible: The edit touches one statement in one tiny module owned by no contract; getVolume/index.js consume the return unchanged, so clamping is locally contained and trivially revertable. No spec fork to settle and nothing separable to slice — routing past one-shot would be pure overhead.
    labels:
      labeler_a: one-shot
      labeler_b: one-shot
      agreement: true

  - id: re-sf-cache
    prompt: Add caching to the getProduct(id) lookups in src/catalog.js.
    correct_floor: spec-first
    trap: must-escalate
    rationale:
      governing_signal: "The repo already contains TWO competing, equally-installed caching conventions, and the target getProduct sits between them: src/cache.js is a process-local TTL Map (Convention A, used by pricing.js, no cross-process invalidation) and src/sessions.js is shared Redis with explicit eviction (Convention B, used because logout must evict for all workers). 'Add caching to getProduct' names no convention, no TTL, and no invalidation hook — the choice is undecided in the code, not in the prompt, which is the spec-first signature."
      decision_hidden: Which convention + invalidation policy governs product reads. catalog.js has a mutation path (updateProduct) and an inline note that a stale read shows a wrong price at checkout — so unlike tiers (which never change and tolerate Convention A's blunt 60s-no-invalidation), getProduct REQUIRES that updateProduct evict the cached entry, and across all web workers. That forces Convention B (Redis with del) plus wiring del() into updateProduct — a policy the prompt never states and the code never settles.
      consequence: "Guessing Convention A (the closest, simplest neighbor) ships a per-process Map with no eviction: updateProduct on worker 1 leaves a stale product cached on workers 2..N until the TTL lapses, so checkout reads a wrong price — the exact failure the catalog.js comment warns about. The footprint is tiny (one function in one file), which is precisely why it's an escalation trap: the small surface hides a correctness-shaped policy decision that a one-shot edit would silently get wrong."
    labels:
      labeler_a: spec-first
      labeler_b: spec-first
      agreement: true

  - id: re-sf-ratelimit
    prompt: Add rate limiting to the login endpoint in src/routes/auth.js.
    correct_floor: spec-first
    held_out: true
    # kind=ci-red — labels this escalated task for the kind-axis fixture's six-kind coverage (ADR-005 / AC11).
    # The kind label is orthogonal metadata for the kind probe; it does not change the complexity floor above.
    kind: ci-red
    trap: must-escalate
    rationale:
      governing_signal: The task names one file (src/routes/auth.js) and reads like a small add, but the surrounding code makes the real work a policy choice, not a code edit. auth.js's register() shows where a limiter slots in but says its key, window, threshold, and store are all unspecified; audit-log.js exposes that the app sits behind a proxy (req.ip is the proxy, X-Forwarded-For is the client); store.js states there is no Redis and counters would live in non-shared, restart-volatile process memory. Tiny footprint, decision-dense — spec-first.
      decision_hidden: "Four undecided policy axes the code surfaces but does not settle: (1) the rate-limit KEY — per-IP (broken behind the proxy auditLog reveals, and punishes a shared NAT) vs per-account (invites lockout-as-DoS); (2) the WINDOW and threshold values; (3) the response on limit (429 + Retry-After, or silent); (4) where counts LIVE, given store.js says there is no external cache and process memory is per-instance and lost on restart."
      consequence: "Guessing ships a fragile limiter: an in-memory per-IP counter looks correct in review yet throttles the proxy's single IP (locking out all users at once or no one), silently resets every deploy, and diverges across instances — a security control that reads as present but does not actually bound credential-stuffing. A one-shot edit hides exactly the decision that determines whether the feature works."
    labels:
      labeler_a: spec-first
      labeler_b: spec-first
      agreement: true

  - id: re-sf-export-big
    prompt: Make the CSV export in src/export.js handle very large datasets without running out of memory.
    correct_floor: spec-first
    rationale:
      governing_signal: "exportCsv in src/export.js buffers the entire result set: source.fetchAll() materializes every row into an array, then encodeRow builds one big string joined with \\r\\n and returned whole — making the prompt's premise ('runs out of memory on very large datasets') literally true. Fixing it is a single coherent change (turn buffering into streaming), not separable components — there is no model/service/endpoint split to slice, so it is spec-first, not decompose."
      decision_hidden: "The seed forces the implementer to PICK a streaming contract before writing code, and the choice is non-obvious: (a) exportCsv's return type — it currently returns a string; streaming means it must instead push into a sink, return an async iterable, or accept a writable — and the two consumers in src/routes.js DISAGREE on the sink (handleDownload pipes to a Node writable HTTP response via res.write/res.end; dumpToFile expects a single string to hand fs.writeFile). (b) the data side: source.js exposes both fetchAll() (whole array) and an unused stream() cursor, and the comment states they are mutually exclusive — so a real fix must switch to stream(). (c) the CSV dialect documented in export.js (header always emitted even when empty, minimal quoting with doubled quotes, \\r\\n separators, NO trailing newline) must survive the rewrite byte-for-byte."
      consequence: Guessing ships something fragile. If the author streams only the file path and leaves handleDownload buffering, the HTTP route still OOMs — the premise is only half-fixed. If they change exportCsv's return shape to satisfy streaming but don't update dumpToFile, the file dump breaks (writeFile gets a stream/iterator, not a string). And a naive line-by-line rewrite that forgets to emit the header on an empty set, or that appends a trailing \r\n, silently corrupts the agreed CSV dialect that downstream consumers parse. The undecided sink-and-return-type policy is exactly what the spec-first shape exists to pin down before code is written.
    labels:
      labeler_a: spec-first
      labeler_b: spec-first
      agreement: true

  - id: re-sf-retry
    prompt: Add retry logic to the chargeCard() call in src/payments.js.
    correct_floor: spec-first
    trap: must-escalate
    rationale:
      governing_signal: "The task names a one-line edit (\"add retry to chargeCard()\"), but chargeCard() is a non-idempotent money movement and the surrounding code carries an unfinished safety contract: gateway.charge() accepts an idempotencyKey and throws GatewayError with a .retryable flag, idempotencyKeyFor(order) already produces a stable key, and checkout.js computes that key but never threads it into the charge. The retry can't be written without deciding what to do with these visible-but-unwired pieces — that is the spec-first fork."
      decision_hidden: "What makes a charge retry SAFE and CORRECT: (a) replaying the existing idempotencyKeyFor(order) key through gateway.charge so a lost-response retry returns the original charge instead of creating a second one, and (b) retrying ONLY on GatewayError.retryable (timeout/503) while letting terminal outcomes like card_declined fail fast — plus the unstated attempt count / backoff."
      consequence: A blind retry wrapper (try/catch + loop, no key, retry-on-any-error) compiles and passes a naive happy-path test but double-charges customers on a timed-out-but-succeeded first attempt and hammers the gateway on hard declines. The fragility ships silently because the seam (idempotency key, .retryable flag) is reused incorrectly, not absent — so guessing produces working-looking, financially unsafe code.
    labels:
      labeler_a: spec-first
      labeler_b: spec-first
      agreement: true

  - id: re-sf-soft-delete
    prompt: Add soft-delete to the records in src/notes.js so deleted notes can be recovered.
    correct_floor: spec-first
    held_out: true
    # kind=feature at spec-first while routing-notifications-feature is feature at decompose — the same kind at
    # two complexities, the orthogonality (AC4) the kind axis is measured against.
    kind: feature
    rationale:
      governing_signal: "The task names one target (src/notes.js) and is one coherent change (soft-delete), but the seed exposes an undecided policy in code: notes.js fixes a timestamp convention (createdAt/updatedAt stored as ISO strings, not epoch numbers or Date objects) and remove() hard-deletes, while queries.js holds four read paths (list/search/count/byId) that all assume every stored row is a live note and filter nothing. There is a real decision fork and a cross-file consistency obligation, so a spec must be pinned before writing — this is spec-first, not a one-shot."
      decision_hidden: What represents 'deleted', and what it costs everywhere it's read. The marker must be chosen (a deletedAt ISO string consistent with the existing timestamp convention, vs. a boolean `deleted` flag, vs. a nullable field) AND every reader in queries.js must learn to exclude tombstones while a new recover path clears the marker. The recovery requirement ('so deleted notes can be recovered') forces a tombstone-in-place design rather than a hard delete, which makes the read-path filtering mandatory rather than optional.
      consequence: Guess the marker shape and it clashes with the ISO-string convention the rest of the module assumes; skip even one reader in queries.js and deleted notes leak into list(), search(), or count() — or a 'recovered' note is unreachable because byId() still hides it. The bug is silent and only surfaces as wrong counts / ghost rows, which is exactly the fragile ship spec-first exists to prevent.
    labels:
      labeler_a: spec-first
      labeler_b: spec-first
      agreement: true

  - id: re-sf-dedupe-events
    prompt: Add a function to src/events.js that removes duplicate analytics events from a batch before they are sent.
    correct_floor: spec-first
    trap: must-escalate
    rationale:
      governing_signal: "src/events.js gives every event TWO ids with opposite semantics: `id` is stamped fresh per delivery attempt (stampEvent increments a seq, so it CHANGES on every retry and is never equal across two records), while `eventId` is the client idempotency key that stampEvent/retryEvent carry UNCHANGED across retries. src/flush.js shows retryEvent re-enqueuing failed attempts, which is exactly how the same logical action lands in one batch twice. So 'remove duplicate events' is not a one-liner: the dedup key is an undecided fork the code makes visible but does not resolve."
      decision_hidden: Which field defines 'duplicate'. Deduping on `id` (the obvious, present-on-every-object field) removes nothing — every record has a distinct per-attempt id, so the filter is a silent no-op. Deduping on `name` (or name+props, or ts) collapses genuinely distinct user actions that happen to share a name. The only correct key is `eventId`, the stable idempotency key the sendBatch ingest contract already rejects duplicates on. The comments state this but the task prompt does not, so a guess picks a plausible-but-wrong field.
      consequence: "Keying on `id` ships a dedupe function that never dedupes, so retried events still trigger the whole-batch rejection sendBatch documents and analytics flushes keep failing. Keying on `name`/`ts` is worse: it drops legitimate distinct events and undercounts real activity. Both look correct in a quick review and only surface as data loss or stuck flushes in production — the spec-first decision must be made and stated, not inferred."
    labels:
      labeler_a: spec-first
      labeler_b: spec-first
      agreement: true

  - id: re-dc-comments
    prompt: "Build a comments feature: a comment data model, a service to create comments, REST endpoints to list and post, and a moderation worker that flags banned words."
    correct_floor: decompose
    rationale:
      governing_signal: "The repo is a layered app skeleton with an established four-directory convention — models/, services/, api/, workers/ plus an app.js that wires routes and starts workers — already demonstrated by a complete existing 'posts' domain. The task ('a comment data model, a service to create comments, REST endpoints to list and post, and a moderation worker') enumerates four distinct artifacts that map one-to-one onto those four directories. The seed makes that decomposition unambiguous: each new comment unit has its own home and its own contract to satisfy, and a parallel reference (the post-* files) shows exactly what the contract for each layer looks like."

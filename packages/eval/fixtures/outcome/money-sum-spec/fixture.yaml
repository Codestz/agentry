# Floor-sensitive outcome fixture — sum a list of prices to an exact cents total (half-up rounding, no float drift).
#
# THE TRAP: naive float arithmetic. `[0.1, 0.2].reduce((a,b)=>a+b)` is 0.30000000000000004; summing many decimals
# accumulates drift; and `Math.round(total*100)/100` mis-rounds a .005 tie DOWN because `1.005*100` evaluates to
# 100.49999999999999 (the classic Math.round float bug) — so the naive impl returns 1.00 where half-up wants 1.01.
# broken/ = `nums.reduce((a,b)=>a+b)` then `Math.round(total*100)/100` — passes trivial sums, mis-rounds the trap.
# golden/ = accumulate in integer thousandths (mills) then round the TOTAL half-up to cents — exact.
# The hidden oracle (oracle/, never seeded) tests BOTH the happy path AND the float-drift / half-up trap cases.
id: money-sum-spec
prompt: >-
  Implement `sumPrices(prices)` in `src/money.js` (currently a stub that throws). Given an array of numbers
  representing dollar amounts (each already at most 3 decimal places), return their TOTAL as a number rounded
  to exactly 2 decimal places (cents), using HALF-UP rounding (a total ending in .005 rounds UP to the next
  cent). The result must be exact — no IEEE-754 float drift. For example `sumPrices([0.1, 0.2])` returns `0.3`
  and `sumPrices([1.005])` returns `1.01`. Keep the CommonJS export. Do not add dependencies.
shape: spec-first
kind: feature
oracle:
  cmd: node --test --test-reporter=tap oracle/*.test.js
  timeoutMs: 30000

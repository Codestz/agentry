# A unified rightsizing fixture (ADR-004) — SPEC-FIRST feature (a coherent change threaded through one module;
# not a one-shot, not a must-escalate trap — the middle of the spread).
#
# Task: convert hard-delete to SOFT-delete in a small store. It is more than a one-symbol edit (it changes the
# delete behavior AND every reader that must now exclude soft-deleted rows, plus a restore path), but the contract
# is given and there is no undecided fork — a clear, coherent change best spec'd before building. Floor: spec-first.
id: rs-soft-delete
prompt: >-
  The in-memory store in `src/store.js` exposes `add(item)`, `get(id)`, `list()`, and `remove(id)` (a HARD delete
  that drops the record). Change deletion to SOFT delete: `remove(id)` must mark the record deleted (set a
  `deletedAt` timestamp using the injected `now()` from the store's options) instead of dropping it; `get(id)` and
  `list()` must EXCLUDE soft-deleted records; and add a `restore(id)` that un-deletes a soft-deleted record so it
  reappears in `get`/`list`. Keep the existing signatures, keep the CommonJS export, and do not add dependencies.
correct_floor: spec-first
rationale:
  governing_signal: "Scope: one coherent change threaded through several readers (delete + get + list + restore) · Specificity: contract clear, no fork"
  seams: "delete-mark, the read filter shared by get/list, and the restore path are one coherent feature touching several behaviors of the module — more than a one-symbol edit, best spec'd before building, but no undecided fork to escalate"
labels: { labeler_a: spec-first, labeler_b: spec-first, agreement: true }
oracle:
  cmd: node --test --test-reporter=tap oracle/*.test.js
  timeoutMs: 30000

# A unified rightsizing fixture (ADR-004) — DECOMPOSE feature (a second decompose, distinct from rs-pagination).
#
# Task: build an event-sourced counter across three separable components: an in-memory event log (append/all), a
# pure reducer (fold one event onto a state), and a replay assembler that folds the whole log into the current
# state. The contract is fully specified (no undecided fork), but it is a genuine multi-part build with clean seams
# between storage, the reducer, and the replay composition — the floor is decompose.
id: rs-event-replay
prompt: >-
  Build an event-sourced counter in `src/`, exposed from `src/index.js`. Three parts: `src/log.js` exports
  `createLog()` returning `{ append(event), all() }` (an in-memory append-only list of events); `src/reducer.js`
  exports `apply(state, event)`, a PURE reducer where `state` is a number and an event is `{ type, by }` —
  `type:"inc"` adds `by`, `type:"dec"` subtracts `by`, default `by` is 1, any other type leaves state unchanged;
  `src/index.js` exports `replay(log)` that folds every event in the log over an initial state of `0` using
  `apply`, returning the final number. So appending `{type:"inc",by:3}` then `{type:"dec"}` then `{type:"inc"}`
  and replaying yields `3`. Keep CommonJS exports across all three files; do not add dependencies.
correct_floor: decompose
rationale:
  governing_signal: "Scope: 3 separable components (log + reducer + replay) with clean seams · Specificity: contract clear"
  seams: "storage (append-only log), a pure reducer (apply), and the replay assembler are three independent units each with its own contract — a multi-part build, not one coherent edit"
labels: { labeler_a: decompose, labeler_b: decompose, agreement: true }
oracle:
  cmd: node --test --test-reporter=tap oracle/*.test.js
  timeoutMs: 30000

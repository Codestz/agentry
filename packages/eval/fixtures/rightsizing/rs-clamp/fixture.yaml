# A unified rightsizing fixture (ADR-004) — TRIVIAL one-shot feature.
#
# Task: ADD a `clamp(n, lo, hi)` helper. The contract is fully specified (return lo if n<lo, hi if n>hi, else n),
# additive to one file, no fork — the floor is one-shot.
id: rs-clamp
prompt: >-
  Add a `clamp(n, lo, hi)` helper to `src/num.js` (which already exports `toFixed2`). `clamp` must return `lo` when
  `n` is below `lo`, `hi` when `n` is above `hi`, and `n` otherwise — so `clamp(5, 0, 10)` is `5`, `clamp(-3, 0, 10)`
  is `0`, and `clamp(99, 0, 10)` is `10`. Export it alongside the existing `toFixed2` via the CommonJS export. Do
  not change `toFixed2`; do not add dependencies.
correct_floor: one-shot
rationale:
  governing_signal: "Specificity: contract fully given · Scope: one additive function · Unknowns: none"
  bounded_reversible: "additive single-function helper with an exact spec, no contract change to existing exports, no fork"
labels: { labeler_a: one-shot, labeler_b: one-shot, agreement: true }
oracle:
  cmd: node --test --test-reporter=tap oracle/*.test.js
  timeoutMs: 30000

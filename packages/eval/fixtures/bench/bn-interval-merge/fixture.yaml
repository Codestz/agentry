# SPEC-FIRST-SCALE + BUG-PRONE + HIDDEN-DECISION bench fixture — "merge overlapping time intervals" is small (2
# files) but hides ONE boundary decision one-shotting risks guessing wrong. The FORK: with HALF-OPEN `[start, end)`
# intervals, do ADJACENT/touching intervals (one ends exactly where the next begins, e.g. `[1,2)` and `[2,3)`)
# merge? They don't strictly overlap (2 is not in `[1,2)`), but they ARE contiguous. The chosen rule (stated in the
# prompt and enforced by the oracle): touching intervals COALESCE into one contiguous range, so `[1,2)`+`[2,3)` →
# `[1,3)`. The SUBTLE BUG the obvious build hits: an off-by-one on the boundary comparison — using strict `<` (which
# wrongly SPLITS the contiguous touching case) or `<=` in the wrong place (which wrongly MERGES truly-disjoint
# intervals like `[1,2)` and `[3,4)`). The held-out oracle probes both boundaries.
id: bn-interval-merge
prompt: >-
  Add interval-merging across two files. `src/interval.js` exports two helpers over HALF-OPEN intervals
  `[start, end)` (each an object `{ start, end }`): `isValid(iv)` returns `true` only when `start` and `end` are
  finite numbers with `start < end`; `touches(a, b)` returns `true` when interval `a` and interval `b` either
  overlap OR are exactly contiguous — i.e. they should be coalesced into one range. `src/merge.js` exports
  `mergeIntervals(intervals)` returning a NEW array (it must not mutate the input) of merged `{ start, end }`
  objects, sorted ascending by `start`: sort the input by `start`, then fold left-to-right, extending the current
  run whenever the next interval `touches` it (overlapping OR contiguous), otherwise starting a new run. THE RULE
  for touching intervals is explicit: because intervals are HALF-OPEN, `[1,2)` and `[2,3)` do NOT overlap (2 is not
  in `[1,2)`) but they ARE contiguous, so they MUST merge into the single contiguous range `[1,3)`; by contrast
  truly-disjoint intervals with a gap, e.g. `[1,2)` and `[3,4)`, MUST stay separate. `mergeIntervals([])` returns
  `[]`. Keep CommonJS exports in both files; do not add dependencies.
fork: "are adjacent/touching half-open intervals merged? — `[1,2)` and `[2,3)` don't overlap (2 ∉ [1,2)) but are contiguous, so they COALESCE into `[1,3)` (use `a.end >= b.start` after sorting), vs a strict-overlap reading (`a.end > b.start`) that wrongly SPLITS the contiguous boundary — and `<=`/`>=` placed wrong instead wrongly MERGES truly-disjoint `[1,2)`+`[3,4)`"
bugProne: true
oracle:
  cmd: node --test --test-reporter=tap oracle/*.test.js
  timeoutMs: 30000

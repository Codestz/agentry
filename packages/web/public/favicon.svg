<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Agentry">
  <!-- The constellation mark: amber spark → violet network (matches Nav/Footer marks).
       Same node topology, recentered into a 32px box with a dark rounded tile so it stays
       legible as a browser tab icon at 16px. -->
  <rect width="32" height="32" rx="7" fill="#0b0b0f"/>
  <g stroke="url(#fav-edge)" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round">
    <line x1="8"  y1="11" x2="16" y2="7"/>
    <line x1="16" y1="7"  x2="24" y2="12"/>
    <line x1="8"  y1="11" x2="13" y2="20"/>
    <line x1="13" y1="20" x2="24" y2="12"/>
    <line x1="13" y1="20" x2="22" y2="24"/>
    <line x1="24" y1="12" x2="22" y2="24"/>
  </g>
  <g>
    <circle cx="16" cy="7"  r="3.1" fill="#f4a93c"/>
    <circle cx="8"  cy="11" r="2.1" fill="#a78bfa"/>
    <circle cx="24" cy="12" r="2.3" fill="#8b5cf6"/>
    <circle cx="13" cy="20" r="2.1" fill="#a78bfa"/>
    <circle cx="22" cy="24" r="2.0" fill="#8b5cf6"/>
  </g>
  <defs>
    <linearGradient id="fav-edge" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4a93c"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
</svg>

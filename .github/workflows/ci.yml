name: CI

# The correctness net for the pnpm workspace: install (frozen) → build → the plugin structure + dist-lockstep
# gate → typecheck + tests for ALL packages (core · memory · eval). Every test is offline (replay/pure — no
# live `claude -p`), so CI never spends API budget.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm (version from the package.json `packageManager` field)
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24" # the memory MCP uses the built-in node:sqlite (Node ≥ 24)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (core tsc + the memory MCP esbuild bundle)
        run: pnpm -r build

      - name: Plugin structure + dist-lockstep gate (validates the shipped mem bundle ↔ src)
        run: node scripts/check-plugin.mjs

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Test (all packages — core · memory · eval)
        run: pnpm -r test

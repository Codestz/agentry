name: CI

# The correctness net: the plugin structure + dist-lockstep gate, then each package's typecheck + tests.
# All tests are offline (replay/pure — no live `claude -p`), so CI never spends API budget.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24" # the memory MCP uses the built-in node:sqlite (Node ≥ 24)

      # @agentry/memory's source + tests are covered here by the dist-lockstep + structure checks (its shipped
      # MCP bundle is content-hash-verified against src). Its standalone unit tests need workspace wiring
      # (it depends on @agentry/core via `workspace:*`) — a follow-up once the repo adopts npm workspaces.
      - name: Plugin structure + dist-lockstep gate
        run: node scripts/check-plugin.mjs

      - name: "@agentry/core — typecheck + test"
        working-directory: packages/core
        run: npm install && npm run typecheck && npm test

      - name: "@agentry/eval — typecheck + test"
        working-directory: packages/eval
        run: npm install && npm run typecheck && npm test

name: Release

# Tagging `v*` publishes a GitHub Release with the plugin payload zip — the `plugin/` directory (manifest +
# agents/commands/skills/hooks + the committed `mem/index.js` bundle), never the dev tree. The structure +
# dist-lockstep gate validates the bundle ↔ src before packaging (CI separately rebuilds + tests the whole
# workspace). Users install the zip via `--plugin-url` (Claude Code ≥ 2.1.128); a marketplace install of the
# repo already gets only `plugin/` via `source: "./plugin"`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release + upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # setup-node@v5 reads the `packageManager: pnpm` field and expects pnpm present, so install it first
      # (mirrors CI). The release does not install deps — it ships the committed mem bundle — pnpm is just for
      # setup-node's package-manager detection.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24" # for the dep-free check-plugin gate

      - name: Verify plugin gate (structure + dist-lockstep — validates the committed mem bundle ↔ src)
        run: node scripts/check-plugin.mjs

      - name: Assemble the plugin payload zip
        run: |
          set -euo pipefail
          # The payload IS `plugin/` (manifest + components + the committed mem bundle). Zip it as `agentry/`.
          mkdir -p out && cp -r plugin out/agentry
          [ -f LICENSE ] && cp LICENSE out/agentry/ || true
          (cd out && zip -rq "../agentry-${GITHUB_REF_NAME}.zip" agentry)
          echo "::group::payload manifest" && unzip -l "agentry-${GITHUB_REF_NAME}.zip" && echo "::endgroup::"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: agentry-*.zip
          generate_release_notes: true

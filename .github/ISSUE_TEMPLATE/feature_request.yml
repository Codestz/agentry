name: Feature request
description: Propose a capability, agent, skill, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem / job-to-be-done
      description: What are you trying to do that Agentry doesn't (or doesn't do well) today? Lead with the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A new agent/skill/command, a routing change, a memory behavior, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this, and why the proposal is better.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Conducting / routing
        - A new or changed agent
        - A new or changed skill
        - Memory / the moat
        - Commands / nodes
        - Self-eval (measurement)
        - Packaging / install
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: This is generic (not specific to one private repo) and fits Agentry's "least process that wins" philosophy
          required: false
